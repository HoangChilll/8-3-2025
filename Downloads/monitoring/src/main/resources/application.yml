spring:
  application:
    name: monitoring

  # PostgreSQL (s? setup ? Phase 2)
  datasource:
    url: jdbc:postgresql://localhost:5432/monitoring
    username: monitoring
    password: monitoring123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update    # dev mode; production s? ??i sang 'validate'
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis (s? setup ? Phase 6)
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

# Actuator endpoints (cho Prometheus sau này)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.hoang.monitoring: DEBUG
